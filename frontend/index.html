<!-- frontend/index.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortner</title>
    <link rel="stylesheet" href="/frontend/index.css">
</head>

<body>
    <main>
        <h1>URL Shortner</h1>
        <p class="tagline">Long links in, short stubs out.</p>

        <section class="block">
            <label>Paste a long URL</label>
            <form id="shorten-form">
                <input type="url" id="url" placeholder="https://example.com/a/very/long/path" required>
                <button type="submit">Shorten</button>
            </form>
        </section>

        <div id="shorten-result" class="result hidden">
            <span id="short-link-text"></span>
            <button id="copy-btn">Copy</button>
        </div>
        <p id="shorten-error" class="error hidden"></p>

        <section class="block">
            <label>Look up a code</label>
            <form id="lookup-form">
                <input type="text" id="lookup-code" placeholder="k3m9qz">
                <button type="submit">Find</button>
            </form>
        </section>
        <div id="lookup-result" class="result hidden"></div>
        <p id="lookup-error" class="error hidden"></p>

        <section class="block">
            <div class="links-header">
                <label>Your links</label>
                <span id="link-count">0</span>
            </div>
            <div id="links-list"></div>
        </section>
    </main>

    <script src="/frontend/index.js"></script>
</body>

</html>
